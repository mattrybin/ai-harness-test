<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>app</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background: #1e1e1e;
        color: #d4d4d4;
        font:
          15px/1.5 -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      #reset {
        position: fixed;
        top: 16px;
        right: 16px;
        background: transparent;
        color: #8b8b8b;
        border: 1px solid #3c3c3c;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      #notes {
        flex: 1;
        overflow: auto;
        padding: 64px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .note {
        background: #252526;
        border: 1px solid #3c3c3c;
        border-radius: 8px;
        padding: 12px 16px;
      }
      #live {
        min-height: 60px;
        padding: 0 24px 16px;
        color: #8b8b8b;
        font-style: italic;
      }
      #talk {
        align-self: center;
        margin-bottom: 40px;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 0;
        background: #0e639c;
        color: #fff;
        font-size: 36px;
        cursor: pointer;
        box-shadow: 0 0 0 0 rgba(14, 99, 156, 0.6);
      }
      #talk.on {
        background: #f14c4c;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(241, 76, 76, 0.6);
        }
        100% {
          box-shadow: 0 0 0 24px rgba(241, 76, 76, 0);
        }
      }
    </style>
  </head>
  <body>
    <button id="reset">Reset</button>
    <div id="notes"></div>
    <div id="live"></div>
    <button id="talk" title="Hold to talk">🎤</button>
    <script>
      const SAMPLES = [
        "Remind me to call the dentist tomorrow at nine.",
        "Okay so the idea is we keep the harness tiny and only add one thing per step.",
        "Buy milk, eggs, and the good coffee, not the cheap one.",
        "Meeting notes: Sam owns the deploy, Priya owns the tests, I own the writeup.",
      ];
      let sampleIndex = 0;
      let speaking = false;
      let timer = null;
      const talk = document.getElementById("talk");
      const live = document.getElementById("live");
      const notes = document.getElementById("notes");

      function startTalking() {
        if (speaking) return;
        speaking = true;
        talk.classList.add("on");
        const text = SAMPLES[sampleIndex++ % SAMPLES.length];
        let i = 0;
        live.textContent = "";
        timer = setInterval(() => {
          live.textContent = text.slice(0, ++i);
          if (i >= text.length) clearInterval(timer);
        }, 40);
      }

      function stopTalking() {
        if (!speaking) return;
        speaking = false;
        talk.classList.remove("on");
        clearInterval(timer);
        if (live.textContent) {
          const box = document.createElement("div");
          box.className = "note";
          box.textContent = live.textContent;
          notes.appendChild(box);
        }
        live.textContent = "";
      }

      talk.onpointerdown = startTalking;
      talk.onpointerup = stopTalking;
      talk.onpointerleave = stopTalking;

      document.getElementById("reset").onclick = () => {
        speaking = false;
        talk.classList.remove("on");
        clearInterval(timer);
        live.textContent = "";
        notes.innerHTML = "";
      };
    </script>
  </body>
</html>
