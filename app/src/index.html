<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>app</title>
    <link rel="stylesheet" href="../dist/styles.css" />
  </head>
  <body
    class="flex h-screen flex-col bg-neutral-900 font-sans text-[15px] text-neutral-300"
  >
    <button
      id="reset"
      class="fixed top-4 right-4 cursor-pointer rounded-md border border-neutral-700 px-3 py-1.5 text-neutral-500"
    >
      Reset
    </button>
    <div class="flex flex-1 overflow-hidden">
      <div
        id="notes"
        class="flex flex-1 flex-col gap-3 overflow-auto px-6 pt-16 pb-6"
      ></div>
      <div
        class="flex w-64 flex-col gap-2 overflow-auto border-l border-neutral-800 px-4 pt-16 pb-6"
      >
        <div class="text-xs tracking-wide text-neutral-500 uppercase">
          notes/
        </div>
        <div id="files" class="flex flex-col gap-2 font-mono text-sm"></div>
      </div>
    </div>
    <div id="live" class="min-h-[60px] px-6 pb-4 text-neutral-500 italic"></div>
    <button
      id="talk"
      title="Hold to talk"
      class="mb-10 h-24 w-24 cursor-pointer self-center rounded-full bg-sky-700 text-4xl text-white select-none"
    >
      🎤
    </button>
    <script src="../dist/renderer.js"></script>
    <script src="../dist/modules/listen.js"></script>
  </body>
</html>
